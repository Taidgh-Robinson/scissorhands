name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra api
      # Fail before unittest discovery if HTTP dependencies are missing; the
      # optional-extra skip remains useful for a CLI-only local installation.
      - run: uv run --no-sync python -c 'import fastapi, httpx, uvicorn'
      - run: uv run --no-sync python -m unittest discover -s tests -v

  cli-tests:
    name: CLI without API dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync python -c 'import importlib.util; assert importlib.util.find_spec("fastapi") is None'
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync scissorhands --help
      - run: uv run --no-sync python -m unittest discover -s tests -v
        working-directory: word_freq_example

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
